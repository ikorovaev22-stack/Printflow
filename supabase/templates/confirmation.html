<h2>Подтвердите email</h2>
<p>Нажмите на ссылку, чтобы подтвердить адрес и войти в приложение типографии:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}">Подтвердить email</a></p>
<p>Если вы не регистрировались, просто проигнорируйте это письмо.</p>
